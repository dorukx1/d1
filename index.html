<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101012;
    --paper: #F3F1EC;
    --muted: #9a99a0;
    --accent-1: #3ED9C4;
    --accent-2: #F2B84B;
    --accent-3: #B18CFF;
    --accent-4: #FF8FB1;
    --font-display: 'Space Grotesk', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-mono);
    overflow: hidden;
  }

  /* ---- ambient background video ---- */
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(0.9) brightness(0.55);
    z-index: -2;
  }

  .bg-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 25%, rgba(16,16,18,0.35), rgba(9,9,10,0.9) 80%);
    z-index: -1;
  }

  .gate {
    position: relative;
    z-index: 1;
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  .panel {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 2.5rem 1.75rem;
    text-decoration: none;
    color: var(--paper);
    background: rgba(23,23,26,0.55);
    backdrop-filter: blur(14px) saturate(1.1);
    -webkit-backdrop-filter: blur(14px) saturate(1.1);
    border-right: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
    transition: flex 0.7s cubic-bezier(.16,1,.3,1), background 0.5s ease;
  }

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .panel { background: rgba(15,15,17,0.94); }
  }

  .panel:last-child { border-right: none; }

  .panel:hover,
  .panel:focus-visible { flex: 1.45; }

  .panel:focus-visible { box-shadow: inset 0 0 0 3px var(--accent); outline: none; }

  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.5s ease;
    z-index: 2;
  }

  .panel:hover::before,
  .panel:focus-visible::before { transform: scaleX(1); }

  .panel::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 100%, var(--accent) 0%, transparent 62%);
    opacity: 0;
    transition: opacity 0.7s ease;
    pointer-events: none;
    z-index: 0;
  }

  .panel:hover::after,
  .panel:focus-visible::after { opacity: 0.2; }

  .panel-1 { --accent: var(--accent-1); }
  .panel-2 { --accent: var(--accent-2); }
  .panel-3 { --accent: var(--accent-3); }
  .panel-4 { --accent: var(--accent-4); }

  .panel-index {
    position: absolute;
    top: 1.75rem;
    left: 1.75rem;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    color: var(--muted);
    z-index: 2;
    transition: color 0.4s ease;
  }

  .panel:hover .panel-index,
  .panel:focus-visible .panel-index { color: var(--accent); }

  .panel-content { position: relative; z-index: 2; }

  .panel-eyebrow {
    display: block;
    font-size: 0.68rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.6rem;
  }

  .panel-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.35rem, 3.2vw, 2.3rem);
    line-height: 1.05;
    margin: 0 0 1rem;
  }

  /* ---- live preview window ---- */
  .preview-frame {
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.12);
    background: #0c0c0e;
    box-shadow: 0 14px 30px -14px rgba(0,0,0,0.65);
    opacity: 0.7;
    transform: translateY(6px) scale(0.97);
    transition: opacity 0.5s ease, transform 0.5s ease, border-color 0.5s ease;
    margin-bottom: 1.1rem;
  }

  .panel:hover .preview-frame,
  .panel:focus-visible .preview-frame { opacity: 1; transform: translateY(0) scale(1); border-color: var(--accent); }

  .preview-titlebar {
    display: flex;
    gap: 5px;
    padding: 7px 9px;
    background: #151517;
  }

  .preview-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.18); }

  .preview-body {
    position: relative;
    width: 100%;
    height: 96px;
    overflow: hidden;
  }

  .preview-body iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 1400px;
    height: 900px;
    border: 0;
    pointer-events: none;
    transform: scale(0.22);
    transform-origin: top left;
    filter: grayscale(45%) brightness(0.85);
    transition: filter 0.5s ease;
  }

  .panel:hover .preview-body iframe,
  .panel:focus-visible .preview-body iframe { filter: grayscale(0%) brightness(1); }

  .panel-arrow {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    opacity: 0;
    transform: translateX(-8px);
    transition: all 0.4s ease;
  }

  .panel:hover .panel-arrow,
  .panel:focus-visible .panel-arrow { opacity: 1; transform: translateX(0); color: var(--accent); }

  @media (max-width: 760px) {
    html, body { overflow-y: auto; }
    .gate { flex-direction: column; height: auto; min-height: 100vh; }
    .panel { flex: none; padding: 2.25rem 1.5rem; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .panel:hover, .panel:focus-visible { flex: none; }
    .panel-index { position: static; writing-mode: horizontal-tb; transform: none; margin-bottom: 0.85rem; }
    .panel-arrow { opacity: 1; transform: none; }
    .preview-frame { opacity: 1; transform: none; }
    .preview-body { height: 82px; }
    .preview-body iframe { filter: grayscale(0%) brightness(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .panel, .panel::before, .panel::after, .panel-index, .panel-arrow, .preview-frame, .preview-body iframe {
      transition: none !important;
    }
  }
</style>
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline poster="/logo.png">
    <source src="/vadi.webm" type="video/webm">
  </video>
  <div class="bg-overlay"></div>

  <div class="gate">
    <a class="panel panel-1" href="/İsveç/index.html">
      <span class="panel-index">İsveç</span>
      <div class="panel-content">
        <span class="panel-eyebrow">Giriş</span>
        <h2 class="panel-title">İsveç Sitesi</h2>
        <div class="preview-frame">
          <div class="preview-titlebar">
            <span class="preview-dot"></span><span class="preview-dot"></span><span class="preview-dot"></span>
          </div>
          <div class="preview-body">
            <iframe src="/İsveç/index.html" loading="lazy" tabindex="-1" aria-hidden="true" sandbox="allow-same-origin allow-scripts"></iframe>
          </div>
        </div>
        <span class="panel-arrow">Devam et →</span>
      </div>
    </a>
    <a class="panel panel-2" href="/Projem/index.html">
      <span class="panel-index">Proje</span>
      <div class="panel-content">
        <span class="panel-eyebrow">Giriş</span>
        <h2 class="panel-title">Lise Projem</h2>
        <div class="preview-frame">
          <div class="preview-titlebar">
            <span class="preview-dot"></span><span class="preview-dot"></span><span class="preview-dot"></span>
          </div>
          <div class="preview-body">
            <iframe src="/Projem/index.html" loading="lazy" tabindex="-1" aria-hidden="true" sandbox="allow-same-origin allow-scripts"></iframe>
          </div>
        </div>
        <span class="panel-arrow">Devam et →</span>
      </div>
    </a>
    <a class="panel panel-3" href="/Sunu/index.html">
      <span class="panel-index">Sunu</span>
      <div class="panel-content">
        <span class="panel-eyebrow">Giriş</span>
        <h2 class="panel-title">Lise Sunumu</h2>
        <div class="preview-frame">
          <div class="preview-titlebar">
            <span class="preview-dot"></span><span class="preview-dot"></span><span class="preview-dot"></span>
          </div>
          <div class="preview-body">
            <iframe src="/Sunu/index.html" loading="lazy" tabindex="-1" aria-hidden="true" sandbox="allow-same-origin allow-scripts"></iframe>
          </div>
        </div>
        <span class="panel-arrow">Devam et →</span>
      </div>
    </a>
    <a class="panel panel-4" href="/denizim/index.html">
      <span class="panel-index">Denizim</span>
      <div class="panel-content">
        <span class="panel-eyebrow">Giriş</span>
        <h2 class="panel-title">Denizim</h2>
        <div class="preview-frame">
          <div class="preview-titlebar">
            <span class="preview-dot"></span><span class="preview-dot"></span><span class="preview-dot"></span>
          </div>
          <div class="preview-body">
            <iframe src="/denizim/index.html" loading="lazy" tabindex="-1" aria-hidden="true" sandbox="allow-same-origin allow-scripts"></iframe>
          </div>
        </div>
        <span class="panel-arrow">Devam et →</span>
      </div>
    </a>
  </div>
</body>
</html>
