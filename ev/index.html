<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ev Giderleri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F1EA;
    --surface:#FFFFFF;
    --ink:#23262B;
    --ink-soft:#6B6B63;
    --line:#DAD4C6;
    --accent:#2B4C7E;
    --accent-soft:#E7ECF3;
    --danger:#B4553A;
    --radius:14px;
    --cat-konut:#2B4C7E;
    --cat-fatura:#B4553A;
    --cat-market:#3E6B4F;
    --cat-ulasim:#8A6D3B;
    --cat-saglik:#7A4B8A;
    --cat-eglence:#4A7A8C;
    --cat-diger:#6B6B6B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{
    max-width:680px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  header.top{margin-bottom:22px;}
  header.top h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:32px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header.top p{
    margin:0;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin:22px 0 18px;
  }
  .month-nav button{
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    font-size:16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .month-nav button:hover{background:var(--accent-soft);}
  .month-nav button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .month-label{
    font-weight:600;
    font-size:15px;
    min-width:150px;
    text-align:center;
  }
  .stamp{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 24px;
    text-align:center;
    margin-bottom:22px;
  }
  .stamp .badge{
    display:inline-block;
    transform:rotate(-1.5deg);
    border:2px solid var(--accent);
    color:var(--accent);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.08em;
    padding:3px 10px;
    border-radius:6px;
    margin-bottom:10px;
    text-transform:uppercase;
  }
  .stamp .total{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:38px;
    letter-spacing:-0.01em;
  }
  .stamp .sub{
    color:var(--ink-soft);
    font-size:13px;
    margin-top:4px;
  }
  section{margin-bottom:26px;}
  section > h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin:0 0 12px;
    font-weight:600;
  }
  .cat-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
  }
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .cat-name{font-size:14px; width:88px; flex-shrink:0;}
  .bar-track{
    flex:1;
    height:7px;
    background:var(--line);
    border-radius:4px;
    overflow:hidden;
  }
  .bar-fill{height:100%; border-radius:4px;}
  .cat-amount{
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    width:84px;
    text-align:right;
    flex-shrink:0;
  }
  form.add-form{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12.5px; color:var(--ink-soft); font-weight:500;}
  .field input, .field select{
    font-family:inherit;
    font-size:15px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:9px;
    background:var(--bg);
    color:var(--ink);
    width:100%;
  }
  .field input:focus, .field select:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
    background:var(--surface);
  }
  @media(min-width:480px){
    .row-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  }
  .submit-btn{
    margin-top:4px;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:12px;
    border-radius:9px;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
  }
  .submit-btn:hover{opacity:0.92;}
  .submit-btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .entry{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-bottom:1px dashed var(--line);
  }
  .entry:last-child{border-bottom:none;}
  .entry-main{flex:1; min-width:0;}
  .entry-desc{font-size:14.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry-meta{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .entry-amount{
    font-family:'IBM Plex Mono', monospace;
    font-size:14.5px;
    font-weight:600;
    flex-shrink:0;
  }
  .del-btn{
    background:none; border:none; color:var(--ink-soft);
    font-size:18px; cursor:pointer; padding:4px 6px; line-height:1;
    flex-shrink:0;
  }
  .del-btn:hover{color:var(--danger);}
  .del-btn:focus-visible{outline:2px solid var(--accent); border-radius:4px;}
  .empty{
    text-align:center;
    padding:26px 16px;
    color:var(--ink-soft);
    font-size:14px;
    background:var(--surface);
    border:1px dashed var(--line);
    border-radius:var(--radius);
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%) translateY(120%);
    background:var(--ink);
    color:#fff;
    padding:11px 16px;
    border-radius:9px;
    font-size:13.5px;
    display:flex;
    align-items:center;
    gap:12px;
    transition:transform 0.25s ease;
    z-index:10;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast button{
    background:none;
    border:none;
    color:#F3C57B;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    font-family:inherit;
  }
  .backup-row{display:flex; gap:10px; flex-wrap:wrap;}
  .ghost-btn{
    flex:1;
    min-width:150px;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    padding:11px 14px;
    border-radius:9px;
    font-size:14px;
    font-weight:500;
    font-family:inherit;
    cursor:pointer;
  }
  .ghost-btn:hover{background:var(--accent-soft); border-color:var(--accent);}
  .ghost-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .backup-note{font-size:12px; color:var(--ink-soft); margin:8px 0 0;}
  @media(prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Ev Giderleri</h1>
    <p>Aylık harcamalarını kaydet, nereye gittiğini gör.</p>
  </header>

  <div class="month-nav">
    <button id="prevMonth" aria-label="Önceki ay">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button id="nextMonth" aria-label="Sonraki ay">›</button>
  </div>

  <div class="stamp">
    <span class="badge" id="recordCountBadge">0 kayıt</span>
    <div class="total" id="monthTotal">₺0</div>
    <div class="sub">bu ayki toplam gider</div>
  </div>

  <section id="breakdownSection">
    <h2>Kategoriye göre</h2>
    <div id="breakdownList"></div>
  </section>

  <section>
    <h2>Yeni gider ekle</h2>
    <form class="add-form" id="addForm">
      <div class="field">
        <label for="descInput">Açıklama</label>
        <input type="text" id="descInput" placeholder="Örn. Elektrik faturası" required maxlength="60">
      </div>
      <div class="row-3">
        <div class="field">
          <label for="amountInput">Tutar (₺)</label>
          <input type="number" id="amountInput" placeholder="0" min="0" step="0.01" required>
        </div>
        <div class="field">
          <label for="categorySelect">Kategori</label>
          <select id="categorySelect"></select>
        </div>
        <div class="field">
          <label for="dateInput">Tarih</label>
          <input type="date" id="dateInput" required>
        </div>
      </div>
      <button type="submit" class="submit-btn">Ekle</button>
    </form>
  </section>

  <section>
    <h2>Kayıtlar</h2>
    <div id="listWrap"></div>
  </section>

  <section>
    <h2>Yedekle</h2>
    <div class="backup-row">
      <button type="button" class="ghost-btn" id="exportBtn">Yedek indir (.json)</button>
      <button type="button" class="ghost-btn" id="restoreBtn">Yedekten geri yükle</button>
      <input type="file" id="restoreInput" accept="application/json" hidden>
    </div>
    <p class="backup-note">Yedek dosyasını telefonuna veya bilgisayarına indirip saklayabilirsin. Geri yüklemek mevcut kayıtları silmez, üzerine ekler.</p>
  </section>
</div>

<div class="toast" id="toast">
  <span id="toastText"></span>
  <button id="undoBtn">Geri al</button>
</div>

<script>
const CATEGORIES = [
  {id:'konut', name:'Konut / Kira', color:'var(--cat-konut)'},
  {id:'fatura', name:'Faturalar', color:'var(--cat-fatura)'},
  {id:'market', name:'Market', color:'var(--cat-market)'},
  {id:'ulasim', name:'Ulaşım', color:'var(--cat-ulasim)'},
  {id:'saglik', name:'Sağlık', color:'var(--cat-saglik)'},
  {id:'eglence', name:'Eğlence', color:'var(--cat-eglence)'},
  {id:'diger', name:'Diğer', color:'var(--cat-diger)'},
];
const STORAGE_KEY = 'ev-giderleri-kayitlari';

let expenses = [];
let selectedMonth = new Date().getMonth();
let selectedYear = new Date().getFullYear();
let lastDeleted = null;
let toastTimer = null;

const currencyFmt = new Intl.NumberFormat('tr-TR', {style:'currency', currency:'TRY'});
const monthNames = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

function catInfo(id){
  return CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length-1];
}

async function loadExpenses(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    expenses = res ? JSON.parse(res.value) : [];
  }catch(e){
    expenses = [];
  }
}

async function saveExpenses(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(expenses), false);
  }catch(e){
    console.error('Kaydetme hatası', e);
  }
}

function populateCategorySelect(){
  const sel = document.getElementById('categorySelect');
  sel.innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

function monthExpenses(){
  return expenses.filter(e => {
    const d = new Date(e.date + 'T00:00:00');
    return d.getMonth() === selectedMonth && d.getFullYear() === selectedYear;
  });
}

function render(){
  document.getElementById('monthLabel').textContent = `${monthNames[selectedMonth]} ${selectedYear}`;
  const list = monthExpenses().sort((a,b)=> b.date.localeCompare(a.date) || b.id - a.id);
  const total = list.reduce((s,e)=> s + e.amount, 0);

  document.getElementById('monthTotal').textContent = currencyFmt.format(total);
  document.getElementById('recordCountBadge').textContent = `${list.length} kayıt`;

  renderBreakdown(list, total);
  renderList(list);
}

function renderBreakdown(list, total){
  const wrap = document.getElementById('breakdownList');
  const section = document.getElementById('breakdownSection');
  if(list.length === 0){ section.style.display = 'none'; wrap.innerHTML=''; return; }
  section.style.display = '';
  const byCat = {};
  list.forEach(e => { byCat[e.category] = (byCat[e.category]||0) + e.amount; });
  const rows = Object.entries(byCat).sort((a,b)=> b[1]-a[1]);
  wrap.innerHTML = rows.map(([catId, amt]) => {
    const c = catInfo(catId);
    const pct = total > 0 ? Math.round((amt/total)*100) : 0;
    return `<div class="cat-row">
      <span class="dot" style="background:${c.color}"></span>
      <span class="cat-name">${c.name}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${pct}%; background:${c.color}"></span></span>
      <span class="cat-amount">${currencyFmt.format(amt)}</span>
    </div>`;
  }).join('');
}

function renderList(list){
  const wrap = document.getElementById('listWrap');
  if(list.length === 0){
    wrap.innerHTML = `<div class="empty">Bu ayda henüz gider yok.<br>Yukarıdan ilk kaydını ekle.</div>`;
    return;
  }
  wrap.innerHTML = list.map(e => {
    const c = catInfo(e.category);
    const d = new Date(e.date + 'T00:00:00');
    const dateLabel = d.toLocaleDateString('tr-TR', {day:'2-digit', month:'short'});
    return `<div class="entry" data-id="${e.id}">
      <span class="dot" style="background:${c.color}"></span>
      <div class="entry-main">
        <div class="entry-desc">${escapeHtml(e.description)}</div>
        <div class="entry-meta">${dateLabel} · ${c.name}</div>
      </div>
      <div class="entry-amount">${currencyFmt.format(e.amount)}</div>
      <button class="del-btn" aria-label="Sil" data-id="${e.id}">×</button>
    </div>`;
  }).join('');

  wrap.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteExpense(Number(btn.dataset.id)));
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function deleteExpense(id){
  const idx = expenses.findIndex(e => e.id === id);
  if(idx === -1) return;
  lastDeleted = expenses[idx];
  expenses.splice(idx,1);
  await saveExpenses();
  render();
  showToast(`"${lastDeleted.description}" silindi`);
}

function showToast(text, showUndo = true){
  const toast = document.getElementById('toast');
  document.getElementById('toastText').textContent = text;
  document.getElementById('undoBtn').style.display = showUndo ? '' : 'none';
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toast.classList.remove('show'), 4500);
}

function exportBackup(){
  const dataStr = JSON.stringify(expenses, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ev-giderleri-yedek-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Yedek indirildi', false);
}

document.getElementById('exportBtn').addEventListener('click', exportBackup);
document.getElementById('restoreBtn').addEventListener('click', () => {
  document.getElementById('restoreInput').click();
});
document.getElementById('restoreInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const imported = JSON.parse(text);
    if(!Array.isArray(imported)) throw new Error('Geçersiz format');
    const existingIds = new Set(expenses.map(x => x.id));
    let added = 0;
    imported.forEach(item => {
      if(!item || typeof item.amount !== 'number' || !item.date || !item.category || !item.description) return;
      let id = item.id;
      if(!id || existingIds.has(id)) id = Date.now() + Math.floor(Math.random()*10000);
      existingIds.add(id);
      expenses.push({id, description:item.description, amount:item.amount, category:item.category, date:item.date});
      added++;
    });
    if(added > 0){
      await saveExpenses();
      render();
    }
    showToast(added > 0 ? `${added} kayıt yedekten eklendi` : 'Yedek dosyasında geçerli kayıt bulunamadı', false);
  }catch(err){
    showToast('Yedek dosyası okunamadı', false);
  }
  e.target.value = '';
});

document.getElementById('undoBtn').addEventListener('click', async () => {
  if(!lastDeleted) return;
  expenses.push(lastDeleted);
  lastDeleted = null;
  await saveExpenses();
  render();
  document.getElementById('toast').classList.remove('show');
});

document.getElementById('prevMonth').addEventListener('click', () => {
  selectedMonth--;
  if(selectedMonth < 0){ selectedMonth = 11; selectedYear--; }
  render();
});
document.getElementById('nextMonth').addEventListener('click', () => {
  selectedMonth++;
  if(selectedMonth > 11){ selectedMonth = 0; selectedYear++; }
  render();
});

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const desc = document.getElementById('descInput').value.trim();
  const amount = parseFloat(document.getElementById('amountInput').value);
  const category = document.getElementById('categorySelect').value;
  const date = document.getElementById('dateInput').value;
  if(!desc || isNaN(amount) || amount <= 0 || !date) return;

  const newExpense = { id: Date.now(), description:desc, amount, category, date };
  expenses.push(newExpense);
  await saveExpenses();

  const d = new Date(date + 'T00:00:00');
  selectedMonth = d.getMonth();
  selectedYear = d.getFullYear();

  e.target.reset();
  document.getElementById('dateInput').value = todayStr();
  render();
});

function todayStr(){
  const t = new Date();
  const m = String(t.getMonth()+1).padStart(2,'0');
  const d = String(t.getDate()).padStart(2,'0');
  return `${t.getFullYear()}-${m}-${d}`;
}

async function init(){
  populateCategorySelect();
  document.getElementById('dateInput').value = todayStr();
  await loadExpenses();
  render();
}
init();
</script>
</body>
</html>
