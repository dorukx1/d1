<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deniz'e Özür</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .heart {
            font-size: 60px;
            margin-bottom: 20px;
            animation: heartBeat 1.3s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.3);
            }
            50% {
                transform: scale(1);
            }
        }

        h1 {
            font-size: 48px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .yes-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .yes-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .yes-btn:active {
            transform: translateY(-1px);
        }

        .no-btn {
            background: #f0f0f0;
            color: #333;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .no-btn:hover {
            background: #e0e0e0;
            transform: translateY(-3px);
        }

        .message {
            display: none;
            margin-top: 30px;
            padding: 40px;
            background: #667eea;
            color: white;
            border-radius: 10px;
            font-size: 20px;
            line-height: 1.8;
            animation: fadeIn 0.5s ease-out;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .message.show {
            display: flex !important;
        }

        .buttons.hidden {
            display: none;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">💜</div>
        <h1>Barışalım mı?</h1>
        <p class="subtitle">Çok üzgünüm Deniz. Lütfen bana bir şans ver ❤️</p>
        
        <div class="buttons">
            <button class="yes-btn" onclick="handleYes()">Evet ✓</button>
            <button class="no-btn" onclick="handleNo()">Hayır ✗</button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <script>
        let noBtnClickCount = 0;

        function handleYes() {
            const message = document.getElementById('message');
            const buttons = document.querySelector('.buttons');
            message.innerHTML = `
                <div>HEHEHE</div>
                <div style="margin-top: 15px; font-size: 24px;">SENI COK SEBIYOM BEBE</div>
                <div style="margin-top: 15px; font-size: 18px; font-weight: 500;">OZUR DILERIM. SENI COK SEBIOM. AYNI HATALARI YAPMICAM c:</div>
            `;
            message.classList.add('show');
            buttons.classList.add('hidden');
            createConfetti();
        }

        function handleNo() {
            const noBtn = document.querySelector('.no-btn');
            const yesBtn = document.querySelector('.yes-btn');
            const message = document.getElementById('message');
            
            noBtnClickCount++;
            
            if (noBtnClickCount === 1) {
                const randomX = Math.floor(Math.random() * 200) - 100;
                const randomY = Math.floor(Math.random() * 200) - 100;
                
                noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
                
                yesBtn.style.transform = 'scale(1.1)';
            } else if (noBtnClickCount === 2) {
                const buttons = document.querySelector('.buttons');
                message.innerHTML = `
                    <div>Israr edemem... 💔</div>
                    <div style="margin-top: 15px; font-size: 20px;">Çünkü seni çok sebiyom.</div>
                    <div style="margin-top: 15px; font-size: 18px; font-weight: 500;">Lütfen bana bi şans daha ver. Her şey düzelecek söz veriyorum. Blup.</div>
                `;
                message.style.background = '#FF6B6B';
                message.classList.add('show');
                buttons.classList.add('hidden');
            }
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-10px';
                confetti.style.background = ['#667eea', '#764ba2', '#FF6B6B', '#FFE66D'][Math.floor(Math.random() * 4)];
                confetti.style.animation = `fall ${2 + Math.random() * 1}s linear`;
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 3000);
            }
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                to {
                    transform: translateY(${window.innerHeight}px) rotate(360deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
